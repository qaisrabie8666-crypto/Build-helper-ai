name: Build Geode Mod
on:
  push:
    branches: [main,master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build unzip curl

      - name: Install Geode CLI
        run: |
          curl -L "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-linux.zip" -o cli.zip
          unzip cli.zip
          sudo mv geode /usr/local/bin/geode
          sudo chmod +x /usr/local/bin/geode
          geode --version

      - name: Setup Geode SDK
        run: |
          geode sdk install $HOME/geode-sdk --yes
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ~/.cpm
          key: cpm-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DGEODE_SDK=${{ env.GEODE_SDK }} \
            -DCPM_SOURCE_CACHE=$HOME/.cpm

      - name: Build
        run: cmake --build build --parallel 4

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: build-helper-ai
          path: |
            build/*.geode
            build/**/*.geode
          retention-days: 30
