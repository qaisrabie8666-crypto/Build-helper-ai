name: Build Geode Mod
on:
  push:
    branches: [main,master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r27
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl git

      - name: Install Geode CLI
        run: |
          curl -L "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-linux.zip" -o cli.zip
          unzip cli.zip
          sudo mv geode /usr/local/bin/geode
          sudo chmod +x /usr/local/bin/geode
          geode --version

      - name: Clone Geode SDK
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/geode-sdk/geode.git $HOME/geode-sdk
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV

      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ~/.cpm
          key: cpm-v3

      - name: Configure
        run: |
          NDK_PATH=${{ steps.ndk.outputs.ndk-path }}
          CLANG_VER=$(ls $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-* | grep -oP 'clang-\K[0-9]+' | sort -n | tail -1)
          echo "NDK Clang version: $CLANG_VER"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DGEODE_SDK=$HOME/geode-sdk \
            -DCPM_SOURCE_CACHE=$HOME/.cpm

      - name: Build
        run: cmake --build build --parallel 4

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: build-helper-ai
          path: build/*.geode
          retention-days: 30
