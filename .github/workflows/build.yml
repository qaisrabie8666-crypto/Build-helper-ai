name: Build Geode Mod
on:
  push:
    branches: [main,master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Install Geode CLI
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -o cli.zip
          unzip cli.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/geode
      - name: Setup Geode SDK
        run: |
          geode sdk install --path $HOME/geode-sdk
          geode sdk update
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV
      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ~/.cpm
          key: cpm-json-3.11.3
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_PATH }}/build/cmake/android.toolchain.cmake \
            -DGEODE_SDK=${{ env.GEODE_SDK }} \
            -DCPM_SOURCE_CACHE=$HOME/.cpm
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: build-helper-ai
          path: build/*.geode
          retention-days: 30
